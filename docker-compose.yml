# Postgres khusus layanan JagoAI Pay. Terpisah dari database akademi (jago_ai_school) supaya
# pencadangan, pemulihan, dan wewenang aksesnya tidak tercampur dengan aplikasi lain.
services:
  db:
    image: postgres:16-alpine
    container_name: jagoai_pay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jagoai
      POSTGRES_PASSWORD: jagoai_dev
      POSTGRES_DB: jagoai_pay
    ports:
      # 5434 dipakai Postgres akademi, 5432/5433 dipakai layanan lain di mesin ini.
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jagoai -d jagoai_pay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
